
<div class="flex flex-col h-full bg-slate-50 relative overflow-hidden">
  
  <!-- Background Elements -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-200/40 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-200/40 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Navbar -->
  <app-navbar 
    [currentTab]="currentView()" 
    (navigate)="navigate($event)"
  ></app-navbar>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto relative z-10 scroll-smooth">
    
    @if (currentView() === 'home') {
      <!-- Home View Container -->
      <div class="min-h-[calc(100vh-4rem)] flex flex-col">
        
        <!-- Hero Section (Conditionally shown or shrinks) -->
        @if (!showDownloader()) {
          <app-hero (onSelectPlatform)="startDownloadFlow($event)"></app-hero>
        } @else {
          <!-- Compact Header when downloader is active -->
          <div class="text-center py-6 animate-fade-in-down border-b border-slate-100 bg-white/50 backdrop-blur-md sticky top-0 z-40">
             <div class="flex items-center justify-center gap-2 mb-1">
               <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
               <h2 class="text-lg font-bold text-slate-900">{{ selectedPlatform() }} Downloader</h2>
             </div>
             <button (click)="showDownloader.set(false)" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium flex items-center justify-center gap-1 mx-auto hover:underline">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
               Back to Home
             </button>
          </div>
          <app-downloader [platformName]="selectedPlatform()"></app-downloader>
        }

      </div>
    }

    @if (currentView() === 'archive') {
      <app-archive></app-archive>
    }

    <!-- Footer -->
    <footer class="py-6 text-center text-slate-400 text-sm mt-auto">
      <p>&copy; 2024 KeepArchive. All rights reserved.</p>
    </footer>

  </main>
</div>
